<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Berita — SMA Harapan Bangsa</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --primary: #1e3a8a;
      --primary-600: #2563eb;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(860px, 92%); margin-inline: auto; }
    .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; width: min(1160px, 92%); margin-inline: auto; }
    .logo { font-weight: 800; color: var(--primary); font-size: 1.05rem; }
    .section { padding: 3rem 0; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; box-shadow: 0 10px 25px -10px rgba(15, 23, 42, 0.1); }
    .meta { display: flex; gap: 0.6rem; align-items: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.7rem; }
    .badge { background: #dbeafe; color: var(--primary); font-weight: 700; font-size: 0.75rem; padding: 0.2rem 0.65rem; border-radius: 999px; }
    h1 { font-size: clamp(1.5rem, 3vw, 2.15rem); margin-bottom: 1.25rem; }
    p { margin-bottom: 1rem; color: var(--text); }
    ul { margin: 1rem 0 0 1.25rem; display: grid; gap: 0.45rem; color: var(--muted); }
    .back-link { display: inline-block; margin-top: 1.5rem; color: var(--primary-600); font-weight: 600; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">SMA Harapan Bangsa</a>
      <a href="admin.html" style="font-weight:600;color:var(--primary-600);">Panel Admin</a>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <article id="detailBerita" class="card"></article>
      <a href="index.html#berita" class="back-link">← Kembali ke Daftar Berita</a>
    </div>
  </main>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const list = ambilBerita();
      const item = list.find((b) => b.slug === slug) || list[0];
      if (!item) return;
      document.title = `${item.judul} — SMA Harapan Bangsa`;
      document.getElementById("detailBerita").innerHTML = `
        <div class="meta"><span>${item.tanggal}</span><span class="badge">${item.kategori}</span></div>
        <h1>${item.judul}</h1>
        ${item.paragraf.map((p) => `<p>${p}</p>`).join("")}
        ${item.poin && item.poin.length ? `<ul>${item.poin.map((pt) => `<li>${pt}</li>`).join("")}</ul>` : ""}
      `;
    });
  </script>
</body>
</html>
